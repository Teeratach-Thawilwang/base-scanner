# Codex, project layer. The twin of .claude/settings.json, and it loads only once this
# project is trusted: `/approvals` inside Codex, or trust_level = "trusted" under
# [projects."/Users/teeratach/Work/Tachari/bamboo"] in ~/.codex/config.toml. An untrusted
# project makes Codex skip this whole .codex/ folder, hooks included, in silence.
#
# This file is in git, so nothing machine-specific and no secret goes in it. MCP servers
# carry absolute paths and a context7 token, so they live in ~/.codex/config.toml, which
# is where ~/.claude.json keeps them for Claude.

# studio renders into storage/ and reads the database, so the workspace is writable.
# The network stays on: npm, the fonts a render pulls, MongoDB Atlas and the ComfyUI PC
# on the LAN are all out of reach without it.
developer_instructions = """
For every task in this project, you MUST follow the complete communication and
writing rules in `.codex/personalization/human-styles.md`.

Read that file in full before your first substantive response in each session.
If context compaction occurs, or you cannot confirm that its full rules remain
in the current context, read it again before the next substantive response.
Treat those rules as mandatory project instructions unless they conflict with
higher-priority platform safety or product instructions.
"""

sandbox_mode = "workspace-write"
approval_policy = "on-request"

[sandbox_workspace_write]
network_access = true
